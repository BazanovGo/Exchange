[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exchange-quant-research"
version = "0.1.0"
description = "Trading strategy research framework built on vectorbt"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "vectorbt>=0.26.0",
    "pandas>=2.0",
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "numba>=0.59",
    "pyarrow>=14.0",
    "scikit-learn>=1.4",
    "plotly>=5.18",
    "matplotlib>=3.8",
    "kaleido>=0.2.1",
    "yfinance>=0.2.36",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.9",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
