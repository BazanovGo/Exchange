[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exchange-research-os"
version = "0.1.0"
description = "A falsification-first quantitative research OS for systematic market research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["quant", "research", "backtesting", "futures", "falsification"]

# Core stays deliberately small: numpy/pandas/scipy only. Every heavy or
# optional dependency lives behind an extra. This is what makes a fast CI run
# and a working numpy>=2 possible -- the audited project was pinned to
# numpy<2 by vectorbt and its test suite did not import at all on current
# Plotly.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0"]
plots = ["matplotlib>=3.8"]
# Running the notebooks under notebooks/ and re-rendering their figures.
notebooks = ["matplotlib>=3.8", "jupyterlab>=4.2", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]
yahoo = ["yfinance>=0.2.36"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyarrow>=14.0",
]

[project.scripts]
exchange = "exchange.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/exchange"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (deselect with -m 'not slow')",
    "control: synthetic positive/negative control tests",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# This test drives the legacy global RNG on purpose: temporary_seed exists
# to save and restore exactly that state.
"tests/test_core.py" = ["NPY002"]
"tests/*" = ["B011"]
# str+Enum is deliberate: order types are serialised into experiment records
# and read back as plain strings.
"src/exchange/execution/orders.py" = ["UP042"]
# deterministic_mode() must touch the legacy global RNG: that is the state
# third-party code reads, and pinning it is the whole point of the function.
"src/exchange/core/determinism.py" = ["NPY002"]
"src/exchange/*/__init__.py" = ["F401"]
"src/exchange/strategies/library.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
packages = ["exchange"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/exchange"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
